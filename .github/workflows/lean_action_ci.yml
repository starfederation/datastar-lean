name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1

      - name: Lint the library
        run: lake lint --builtin-only --linters=.missingDocs Datastar

  # The Brotli codec is a separate package with C sources, built by Lake with the system compiler.
  brotli:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v5

      - name: Build the library
        uses: leanprover/lean-action@v1
        with:
          build-args: "Datastar"

      - name: Test datastar-brotli
        run: lake -d datastar-brotli test

      - name: Lint datastar-brotli
        run: lake -d datastar-brotli lint --builtin-only --linters=.missingDocs DatastarBrotli

      - name: Test datastar-brotli under sanitizers
        run: datastar-brotli/scripts/sanitize.sh

  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Build e2e-server
        uses: leanprover/lean-action@v1
        with:
          build-args: "e2e-server"

      # Built here so that Playwright does not time out waiting for it to compile.
      - name: Build brotli-e2e-server
        run: lake -d datastar-brotli build brotli-e2e-server

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/test-results/

  sdk-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v5

      - name: Build sdk-test-server
        uses: leanprover/lean-action@v1
        with:
          build-args: "sdk-test-server"

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Run official Datastar SDK tests
        run: ./scripts/test-sdk.sh
